name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *' # Todo dia às 12h UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 30 \
              "$SUPABASE_URL/rest/v1/settings?select=key&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY") || code=000
            echo "Tentativa $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Supabase ativo."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase não respondeu (HTTP $code). O projeto pode estar pausado: restaure em https://supabase.com/dashboard/project/mpchsfmhwlcekblrcawm"
          exit 1
